  - {name: Med school year 3, remove: true}
  - {name: Med school year 4, remove: true}
  - {name: Med loan year 1, remove: true}
  - {name: Med loan year 2, remove: true}
  - {name: Med loan year 3, remove: true}
  - {name: Med loan year 4, remove: true}
