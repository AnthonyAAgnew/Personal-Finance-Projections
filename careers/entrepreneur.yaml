name: Med device entrepreneur
description: >
  Found a medical device startup right after the Ph.D. Lean grant-funded years,
  then either raise venture money or go back to industry. Funded companies
  are eventually acquired or shut down. Most of the upside is a rare exit.

sources:
  - "QSBS: the One Big Beautiful Bill Act (2025) raised the federal gain exclusion to $15M for stock issued after July 4, 2025; California does not follow QSBS (via search)"
  - "PMCF via MedDeviceGuide: median medtech M&A upfront value $171M in Q1 2026 (disclosed deals; undisclosed deals are usually smaller): https://meddeviceguide.com/blog/medtech-ma-market-analysis-h1-2026-deal-trends-strategic-shifts-guide"
  - "Hours: Antler 2025 founder survey via The Next Web: ~75% of founders work 60+ hrs/week, 19% 80+; Australian venture-backed founders average 64: https://thenextweb.com/news/european-startup-founders-work-long-hours"
  - "Hours: Consulting-Specifying Engineer 2024 survey: engineers average 43 hrs/week, 24% work 50+: https://www.csemag.com/how-mep-fp-engineers-are-living-a-dual-reality/"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout: Sifted 2025 founder survey (138 founders): 54% burned out in the past 12 months; Startup Snapshot 2023: 72% report a mental health impact: https://fortune.com/2025/09/12/we-studied-entrepreneurs-burnout-anxious-depressed-wellbeing/"
  - "Kruze Consulting startup CEO salaries 2025: seed ~$147k, Series A ~$203k: https://kruzeconsulting.com/blog/post/startup-ceo-salary-report"
  - "Citeline: VCs estimate 25-30% of device investments reach a successful exit: https://scrip.citeline.com/SC091507/Medtech-Venture-Capital-Heads-into-Unfamiliar-Terrain"
  - "PitchBook Q4 2025 analyst note: medtech takes 10+ years from founding to exit: https://files.pitchbook.com/website/files/pdf/Q4_2025_PitchBook_Analyst_Note_The_Medtech_VC_Paradox_20372.pdf"
  - "PMCF via MedDeviceGuide: median medtech M&A upfront value $171M in Q1 2026: https://meddeviceguide.com/blog/medtech-ma-market-analysis-h1-2026-deal-trends-strategic-shifts-guide"

assumptions:
  - "Exit proceeds come from a cap table (CHECK, the weakest numbers here): you start with 30% (three co-founders), a 15% option pool, then four rounds dilute 20%, 25%, 25% and 20%, leaving you ~9%. Investors put in $90M with 1x non-participating preference."
  - "Sale price is lognormal with a $120M median. Investors take their $90M back first unless converting pays them more, so about 4 in 10 acquisitions pay founders nothing; the median founder payout is ~$7.6M before tax (P90 ~$39M)."
  - "Tax: California 13.3% on all of it; federal 23.8% only above the $15M QSBS exclusion."
  - "Years 1-2: about $50k from SBIR/STTR grants or a small pre-seed round (CHECK)."
  - "40% chance of raising seed / Series A around age 29 (±1), then a founder salary of $150k. The other 60% return to industry R&D at $150k."
  - "Funded companies resolve about 5 years later (±2): 30% acquired (the upper end of VC estimates, since the 25-30% is among funded deals) and 70% shut down."
  - "Overall exit chance is therefore about 12%."
  - "After an exit or shutdown you take an industry role ($200k after an exit, $165k after a shutdown). No 401(k) match is modeled."
  - "Hours: 62 while founding (Antler: 75% of founders work 60+; Australian average 64), 60 once funded, 44 back in industry."
  - "Autonomy 99 (Chief Executives) while founding. Burnout 54% (Sifted 2025). Satisfaction 70% (CHECK: no founder satisfaction survey found)."

# Runway window: the grant-funded years until funding (used by life/runway_*).
portfolio:
  cash:
    runway_window: [4, 8]

income:
  - name: Career pay
    amount: 50000
    start_year: 4
    growth: {mean: 0.01, stdev: 0.03}
    noise: 0.10
    taxable: true

time:
  - {name: Work hours, amount: 62, start_year: 4}

events:
  - name: Raises venture funding
    confidence: medium
    type: set_amount
    target: Career pay
    amount: 150000
    year: 6
    jitter: 1
    group: funding
    probability: 0.4
  - name: Returns to industry (no funding)
    type: set_amount
    target: Career pay
    amount: 150000
    year: 6
    jitter: 1
    group: funding
    probability: 0.6
  - name: Company acquired
    type: windfall
    confidence: low
    equity:
      sale_median: 120000000      # CHECK: below the $171M disclosed-deal median
      sale_spread: 1.0
      founder_share: 0.30         # you, with two co-founders
      option_pool: 0.15
      dilution: [0.20, 0.25, 0.25, 0.20]   # seed, Series A, B, C
      raised: 90000000            # 1x non-participating preferred
      qsbs_cap: 15000000
    same_time_as: Raises venture funding
    offset: 5
    jitter: 2
    group: outcome
    probability: 0.3
  - name: Role after acquisition
    type: set_amount
    target: Career pay
    amount: 200000
    same_time_as: Company acquired
  - name: Company shuts down
    type: set_amount
    target: Career pay
    amount: 165000
    same_time_as: Raises venture funding
    offset: 5
    jitter: 2
    group: outcome
    probability: 0.7
  - {name: Hours after funding, type: set_amount, target: Work hours, amount: 60, same_time_as: Raises venture funding}
  - {name: Hours back in industry, type: set_amount, target: Work hours, amount: 44, same_time_as: Returns to industry (no funding)}
  - {name: Hours after acquisition, type: set_amount, target: Work hours, amount: 44, same_time_as: Company acquired}
  - {name: Hours after shutdown, type: set_amount, target: Work hours, amount: 44, same_time_as: Company shuts down}

# Non-financial scores for the Decide tab (see sources and assumptions).
quality: {autonomy: 99, satisfaction: 0.7, burnout: 0.54}
