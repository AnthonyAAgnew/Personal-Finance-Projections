name: Patent litigator (BigLaw)
description: >
  JD after the Ph.D., then patent litigation at a large firm on the BigLaw
  (Cravath) salary scale. Highest pay and hours among the law paths; most
  associates leave for in-house roles before partnership.

sources:
  - "Hours: Wells Fargo Legal Specialty Group via Bloomberg Law: top-100 firm lawyers billed ~1,551 hours in 2023; firm targets are 1,900-2,200 billable (Harvest): https://news.bloomberglaw.com/us-law-week/less-work-more-money-big-law-associates-never-had-it-better"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout: Bloomberg Law 2024 Attorney Workload survey: attorneys burned out 42% of the time on average, mid/senior associates 51%: https://pro.bloomberglaw.com/insights/company-news/bloomberg-law-releases-attorney-workload-survey-insights-and-webinar-on-work-life-balance-solutions/"
  - "ABA Young Lawyers Division 2024 survey: median law school debt $112,500 (via Bankrate): https://bankrate.com/loans/student-loans/average-law-school-debt"
  - "Private law school tuition averages about $49k-$53k/yr in 2025-26 (aggregators citing ABA data): https://www.bestcolleges.com/research/law-school-cost/"
  - "BigLaw 2025 scale: $225k first year rising to $435k in year 8, plus bonuses of $20k-$115k (BCG Search, LawFuel): https://www.bcgsearch.com/bigLaw_associate_salaries_2000-2025.php"
  - "Bloomberg Law: the $225,000 starting salary: https://news.bloomberglaw.com/ip-law/the-225-000-starting-salary-how-big-law-associates-make-bank"

assumptions:
  - "Hiring odds (CHECK): a 60% chance of a BigLaw patent-litigation offer after the JD (a technical Ph.D. helps; the law school attended matters most). Otherwise patent prosecution at an IP firm (~$200k, ~$270k as senior associate or counsel), as in the prosecution path."
  - "Living costs during law school are borrowed too: ~$30k a year (less in 2L, when the summer associate job pays ~$40k), at the same 8% and 10-year term. ABA cost-of-attendance budgets include similar living allowances (CHECK)."
  - "One year as an R&D engineer ($150k, year 4), one year studying for the LSAT and applying with no pay (year 5, CHECK: you may be able to study while working), then a full-time JD in years 6-8 (ages 28-30) at ~$50k/yr tuition, all borrowed at ~8% (federal grad rates are near 8%; 2026 federal caps may push part of it private). Living costs stay at your Ph.D.-level budget. Repaid over 10 years from graduation."
  - "A 2L summer associate job pays ~$40k (CHECK)."
  - "Associate pay follows the scale with bonuses: ~$245k (year 1), ~$318k (year 3), ~$385k (year 5), ~$550k (year 8)."
  - "Around age 39: 15% make partner (~$1.2M, wide spread); 85% move in-house at ~$320k. CHECK"
  - "Hours: 50 in law school (CHECK); 58 as a BigLaw associate (a ~2,000-hour billable target is roughly 2,700 hours worked over 48 weeks; Harvest says 60+); 55 as partner and 45 in-house (CHECK)."
  - "Autonomy 92 (Lawyers; associates have less). Burnout 51% (Bloomberg Law: mid/senior associates). Satisfaction 55% (CHECK)."

