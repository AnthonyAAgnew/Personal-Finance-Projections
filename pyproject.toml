[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stats-projections"
version = "0.1.0"
description = "A small Monte Carlo life planner: how often do my finances fail?"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
stats-projections = "stats_projections.cli:main"

[tool.setuptools]
packages = ["stats_projections"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
