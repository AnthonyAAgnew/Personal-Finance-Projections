name: Self-funded consumer product business
description: >
  Start a consumer product company with your own money and no investors.
  Lean first years; most small businesses close within five years; the
  survivors pay their owner well and some are sold.

sources:
  - "Hours: Antler 2025 founder survey via The Next Web: ~75% of founders work 60+ hrs/week, 19% 80+; Australian venture-backed founders average 64: https://thenextweb.com/news/european-startup-founders-work-long-hours"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout: Sifted 2025 founder survey (138 founders): 54% burned out in the past 12 months; Startup Snapshot 2023: 72% report a mental health impact: https://fortune.com/2025/09/12/we-studied-entrepreneurs-burnout-anxious-depressed-wellbeing/"
  - "SBA tabulation of BLS data: 49.2% of new establishments survive 5 years, 33.9% survive 10: https://startbusinessbystate.com/business-survival-rates-by-state"

assumptions:
  - "Year 1: $40k of your savings for tooling, inventory and launch. Owner pay ~$20k/yr until the business proves out."
  - "Around age 27 (+-1): 35% take off (owner earnings ~$160k, swinging +-30% a year), 65% close and you return to industry (~$140k). Below the 49% all-business average because solo product launches are riskier. CHECK"
  - "Of the businesses that take off, 20% are sold ~8 years later (median $1.5M, ~3x owner earnings; taxed 20%) and you take a ~$150k job."
  - "Hours: 60 while building (founder surveys), 50 once it works (CHECK), 44 back in industry."
  - "Autonomy 99 (Chief Executives). Burnout 54% (Sifted 2025 founders). Satisfaction 70% (CHECK)."

income:
  - {name: Career pay, amount: 20000, start_year: 2, noise: 0.3, taxable: true}

time:
  - {name: Work hours, amount: 60, start_year: 2}

events:
  - {name: Tooling and inventory, type: purchase, amount: 40000, year: 2}
  - {name: Business takes off, type: set_amount, target: Career pay, amount: 160000, year: 5, jitter: 1, group: outcome, probability: 0.35}
  - {name: Business closes, type: set_amount, target: Career pay, amount: 140000, year: 5, jitter: 1, group: outcome, probability: 0.65}
  - {name: Owner hours, type: set_amount, target: Work hours, amount: 50, same_time_as: Business takes off}
  - {name: Industry hours (after closing), type: set_amount, target: Work hours, amount: 44, same_time_as: Business closes}
  - {name: Sells the business, type: windfall, amount: 1500000, spread: 0.8, tax_rate: 0.20, same_time_as: Business takes off, offset: 8, jitter: 2, probability: 0.2}
  - {name: Job after the sale, type: set_amount, target: Career pay, amount: 150000, same_time_as: Sells the business}

# Non-financial scores for the Decide tab (see sources and assumptions).
quality: {autonomy: 99, satisfaction: 0.7, burnout: 0.54}
