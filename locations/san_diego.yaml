name: San Diego
description: >
  San Diego device cluster (Dexcom, ResMed, Medtronic). Pay and costs close to Irvine; included mainly as a check that location matters little within Southern California.

sources:
  - "WageDex (BLS OEWS 17-2031): San Diego median $128,270: https://wagedex.com/jobs/bioengineers-and-biomedical-engineers/metro/san-diego-chula-vista-carlsbad-ca"

assumptions:
  - "Relative to Irvine, the profile's baseline. You move when your post-Ph.D. career starts (year 4)."
  - "Pay about the same as Irvine; rent about 5% lower (CHECK)."
  - "Careers already tied to a place (FDA in Maryland, quant finance in New York) get this adjustment on top of their own; treat those combinations loosely."

lifestyle:
  cost_index: [[4, 1.0]]

