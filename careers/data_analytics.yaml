name: Data scientist / analytics
description: >
  Switch from BME to data-focused industry work (data science, analytics,
  biostatistics-adjacent roles). The M.S. in Statistics is the main asset.

sources:
  - "Hours: Consulting-Specifying Engineer 2024 survey: engineers average 43 hrs/week, 24% work 50+: https://www.csemag.com/how-mep-fp-engineers-are-living-a-dual-reality/"
  - "Hours: Engineering Management Institute Future of Work report: architecture and engineering professionals average 45 hrs/week"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout and satisfaction: Jellyfish 2024 State of Engineering Management (604 respondents): 65% burned out in the past year (85% on teams under 10), 46% of engineers say their team is burned out, 75% find their work rewarding: https://jellyfish.co/blog/2024-state-of-engineering-management-report/"
  - "BLS OEWS May 2024 national tables (data scientists, SOC 15-2051): https://www.bls.gov/oes/2024/may/featured_data.htm"

assumptions:
  - "Senior data scientist at ~$150k (CHECK: the BLS median for data scientists was not returned by search; a Ph.D. plus an M.S. in Statistics usually starts above the median)."
  - "Staff level around age 31 (~$185k); 30% reach principal or manager (~$230k) around age 35. CHECK"
  - "4% yearly layoff risk."
  - "Hours: 44/week (engineering survey averages; no data-science-specific survey found, CHECK)."
  - "Autonomy 76 (Data Scientists). Burnout and satisfaction from the Jellyfish engineering survey (CHECK)."

