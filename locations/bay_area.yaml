name: Bay Area (San Jose / SF)
description: >
  Industry roles in the Bay Area medtech cluster (Intuitive, Abbott, J&J MedTech, startups). Higher pay, much higher rent; still California taxes.

sources:
  - "WageDex (BLS OEWS 17-2031): San Jose median $136,450 vs San Diego $128,270: https://wagedex.com/jobs/bioengineers-and-biomedical-engineers/metro/san-jose-sunnyvale-santa-clara-ca"

assumptions:
  - "Relative to Irvine, the profile's baseline. You move when your post-Ph.D. career starts (year 4)."
  - "Pay about 10% above Irvine (CHECK)."
  - "Rent about 45% higher, other costs about 10% higher; lifestyle tiers cost 25% more (CHECK)."
  - "Careers already tied to a place (FDA in Maryland, quant finance in New York) get this adjustment on top of their own; treat those combinations loosely."

lifestyle:
  cost_index: [[4, 1.25]]

