name: Patent litigator (BigLaw)
description: >
  JD after the Ph.D., then patent litigation at a large firm on the BigLaw
  (Cravath) salary scale. Highest pay and hours among the law paths; most
  associates leave for in-house roles before partnership.

sources:
  - "ABA Young Lawyers Division 2024 survey: median law school debt $112,500 (via Bankrate): https://bankrate.com/loans/student-loans/average-law-school-debt"
  - "Private law school tuition averages about $49k-$53k/yr in 2025-26 (aggregators citing ABA data): https://www.bestcolleges.com/research/law-school-cost/"
  - "BigLaw 2025 scale: $225k first year rising to $435k in year 8, plus bonuses of $20k-$115k (BCG Search, LawFuel): https://www.bcgsearch.com/bigLaw_associate_salaries_2000-2025.php"
  - "Bloomberg Law: the $225,000 starting salary: https://news.bloomberglaw.com/ip-law/the-225-000-starting-salary-how-big-law-associates-make-bank"

assumptions:
  - "Full-time JD in years 2-4 (ages 31-33) at ~$50k/yr tuition, all borrowed at ~8% (federal grad rates are near 8%; 2026 federal caps may push part of it private). Living costs stay at your Ph.D.-level budget. Repaid over 10 years from graduation."
  - "A 2L summer associate job pays ~$40k (CHECK)."
  - "Associate pay follows the scale with bonuses: ~$245k (year 1), ~$318k (year 3), ~$385k (year 5), ~$550k (year 8)."
  - "Around age 42: 15% make partner (~$1.2M, wide spread); 85% move in-house at ~$320k. CHECK"
  - "~65 hours a week as an associate, ~60 as partner, ~48 in-house."

