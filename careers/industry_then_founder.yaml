name: Industry, then device founder
description: >
  Work as an R&D engineer for about 4 years after the Ph.D. to build savings,
  regulatory experience and contacts, then found a device company and live
  off savings (a self-funded runway) until it raises money or you return to
  industry. Compare with "Med device entrepreneur" (founding right after the
  Ph.D.) and "R&D engineer" (keeping the savings invested).

extends: rd_engineer.yaml

sources:
  - "QSBS: the One Big Beautiful Bill Act (2025) raised the federal gain exclusion to $15M for stock issued after July 4, 2025; California does not follow QSBS (via search)"
  - "PMCF via MedDeviceGuide: median medtech M&A upfront value $171M in Q1 2026 (disclosed deals; undisclosed deals are usually smaller): https://meddeviceguide.com/blog/medtech-ma-market-analysis-h1-2026-deal-trends-strategic-shifts-guide"
  - "Hours: Antler 2025 founder survey via The Next Web: ~75% of founders work 60+ hrs/week, 19% 80+; Australian venture-backed founders average 64: https://thenextweb.com/news/european-startup-founders-work-long-hours"
  - "Burnout: Sifted 2025 founder survey (138 founders): 54% burned out in the past 12 months; Startup Snapshot 2023: 72% report a mental health impact: https://fortune.com/2025/09/12/we-studied-entrepreneurs-burnout-anxious-depressed-wellbeing/"
  - "Kruze Consulting startup CEO salaries 2025: seed ~$147k, Series A ~$203k: https://kruzeconsulting.com/blog/post/startup-ceo-salary-report"
  - "Citeline: VCs estimate 25-30% of device investments reach a successful exit: https://scrip.citeline.com/SC091507/Medtech-Venture-Capital-Heads-into-Unfamiliar-Terrain"
  - "PMCF via MedDeviceGuide: median medtech M&A upfront value $171M in Q1 2026: https://meddeviceguide.com/blog/medtech-ma-market-analysis-h1-2026-deal-trends-strategic-shifts-guide"

assumptions:
  - "Exit proceeds from a cap table (CHECK): you start with 35% since savings replace a seed round, a 15% option pool, then Series A, B and C dilute 25%, 25% and 20%, leaving ~13%. Investors put in $70M with 1x non-participating preference; sale price median $120M. About 3 in 10 acquisitions pay founders nothing."
  - "Tax: California 13.3% on all of it; federal 23.8% only above the $15M QSBS exclusion."
  - "Leaves industry around age 30 (±1). No salary and no 401(k) match while bootstrapping; living costs come out of your portfolio (lifestyle tiers shrink as income stops)."
  - "About 2 years later, 50% raise a seed or Series A (vs 40% when founding straight out of the Ph.D.: industry experience and contacts help, CHECK) and pay a founder salary of $175k. The other 50% return to industry at $165k."
  - "Funded companies resolve about 5 years later (±2): 30% acquired, 70% shut down, as in the entrepreneur path."
  - "After an exit, an industry role at $210k; after a shutdown or no funding, $175k-$165k with the 401(k) match back."
  - "The R&D path's age-40 promotion is dropped; returning to industry is the promotion here."
  - "Hours: 44 in industry, 62 while bootstrapping, 60 once funded, 44 after."
  - "Autonomy 90: years in industry (75) and as a founder (99), weighted by time (CHECK). Burnout 50%: founders' 54%, diluted by industry years. Satisfaction 72% (CHECK)."

# Runway window: two years before founding (to build it) through the first
# funding decision. Used by the runway add-ons in life/.
portfolio:
  cash:
    runway_window: [6, 12]

events:
  - {name: Promotion to senior principal, remove: true}

  - name: Leaves to found a company
    type: set_amount
    target: Career pay
    amount: 0
    year: 8
    jitter: 1
  - {name: No match while founding, type: set_amount, target: Employer 401(k) match, amount: 0, same_time_as: Leaves to found a company}
  - name: Raises venture funding
    confidence: medium
    type: set_amount
    target: Career pay
    amount: 175000
    same_time_as: Leaves to found a company
    offset: 2
    group: funding
    probability: 0.5
  - name: Returns to industry (no funding)
    type: set_amount
    target: Career pay
    amount: 165000
    same_time_as: Leaves to found a company
    offset: 2
    group: funding
    probability: 0.5
  - name: Company acquired
    type: windfall
    confidence: low
    equity:
      sale_median: 120000000      # CHECK
      sale_spread: 1.0
      founder_share: 0.35         # self-funded longer, so a bigger starting stake
      option_pool: 0.15
      dilution: [0.25, 0.25, 0.20]         # Series A, B, C (no seed round needed)
      raised: 70000000
      qsbs_cap: 15000000
    same_time_as: Raises venture funding
    offset: 5
    jitter: 2
    group: outcome
    probability: 0.3
  - name: Role after acquisition
    type: set_amount
    target: Career pay
    amount: 210000
    same_time_as: Company acquired
  - name: Company shuts down
    type: set_amount
    target: Career pay
    amount: 175000
    same_time_as: Raises venture funding
    offset: 5
    jitter: 2
    group: outcome
    probability: 0.7
  - {name: Match back (no funding), type: set_amount, target: Employer 401(k) match, amount: 9000, same_time_as: Returns to industry (no funding)}
  - {name: Match back (after acquisition), type: set_amount, target: Employer 401(k) match, amount: 9000, same_time_as: Company acquired}
  - {name: Match back (after shutdown), type: set_amount, target: Employer 401(k) match, amount: 9000, same_time_as: Company shuts down}

  - {name: Founding hours, type: set_amount, target: Work hours, amount: 62, same_time_as: Leaves to found a company}
  - {name: Hours after funding, type: set_amount, target: Work hours, amount: 60, same_time_as: Raises venture funding}
  - {name: Hours back in industry, type: set_amount, target: Work hours, amount: 44, same_time_as: Returns to industry (no funding)}
  - {name: Hours after acquisition, type: set_amount, target: Work hours, amount: 44, same_time_as: Company acquired}
  - {name: Hours after shutdown, type: set_amount, target: Work hours, amount: 44, same_time_as: Company shuts down}

# Non-financial scores for the Decide tab (see sources and assumptions).
quality: {autonomy: 90, satisfaction: 0.72, burnout: 0.5}
