name: Product design engineer
description: >
  Switch from BME research to product-design-focused engineering (consumer
  or medical hardware): mechanical design, prototyping, DFM. Your M.E.
  background plus the Ph.D. places you at a senior level.

sources:
  - "BLS OOH, mechanical engineers: median $102,320 (May 2024): https://www.bls.gov/OOH/architecture-and-engineering/mechanical-engineers.htm"

assumptions:
  - "Senior product design engineer at ~$135k (above the BLS median given the Ph.D. and J&J years). CHECK"
  - "Staff level around age 38 (~$170k); 25% reach principal at a top consumer-hardware company (~$230k) around age 42. CHECK"
  - "3% yearly layoff risk; ~45 hours a week."

income:
  - {name: Career pay, amount: 135000, start_year: 2, growth: {mean: 0.01, stdev: 0.03}, noise: 0.05, loss_probability: 0.03, loss_fraction: 0.4, taxable: true}
  - {name: Employer 401(k) match, amount: 8000, start_year: 2, end_year: 36, spendable: false}

time:
  - {name: Work hours, amount: 45, start_year: 2, growth: {mean: -0.003, stdev: 0.01}}

events:
  - {name: Staff product design engineer, type: set_amount, target: Career pay, amount: 170000, year: 7, jitter: 1}
  - {name: Principal at top hardware company, type: set_amount, target: Career pay, amount: 230000, year: 11, jitter: 2, probability: 0.25}
