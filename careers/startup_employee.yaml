name: Early-stage startup employee
description: >
  Join early-stage (seed / Series A) med device or health-tech startups as an
  engineer, not a founder. Market salary, options that usually end up
  worth little, more job churn.

sources:
  - "Hours: Consulting-Specifying Engineer 2024 survey: engineers average 43 hrs/week, 24% work 50+: https://www.csemag.com/how-mep-fp-engineers-are-living-a-dual-reality/"
  - "Hours: Antler 2025 founder survey via The Next Web: ~75% of founders work 60+ hrs/week, 19% 80+; Australian venture-backed founders average 64: https://thenextweb.com/news/european-startup-founders-work-long-hours"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout and satisfaction: Jellyfish 2024 State of Engineering Management (604 respondents): 65% burned out in the past year (85% on teams under 10), 46% of engineers say their team is burned out, 75% find their work rewarding: https://jellyfish.co/blog/2024-state-of-engineering-management-report/"
  - "Carta: after Series A the median employee option pool is ~12% (founders ~56%): https://carta.com/data/linkedin-founder-vs-employee-ownership-over-time/"

assumptions:
  - "Salary ~$150k, a bit below big-company total pay. CHECK"
  - "10% yearly chance the startup folds or you are cut (lose ~40% of that year's pay while job hunting)."
  - "Equity, around age 34 (+-3): 10% chance of a modest payout (median $500k), 3% chance of a big one (median $3M); 87% nothing. Taxed at a flat 25%. CHECK: no public data on employee payout rates was found."
  - "Hours: 50/week. No survey of early startup employees was found; set between engineers' 43-45 and founders' 60+ (CHECK)."
  - "Autonomy 82 (Software Developers). Burnout 85% (Jellyfish: engineers on teams under 10). Satisfaction 70% (CHECK)."

income:
  - {name: Career pay, amount: 150000, start_year: 4, growth: {mean: 0.01, stdev: 0.03}, noise: 0.05, loss_probability: 0.10, loss_fraction: 0.4, taxable: true}

time:
  - {name: Work hours, amount: 50, start_year: 4}

events:
  - {name: Equity payout (modest exit), type: windfall, amount: 500000, spread: 1.0, tax_rate: 0.25, year: 12, jitter: 3, group: equity, probability: 0.10, confidence: low}
  - {name: Equity payout (big exit), type: windfall, amount: 3000000, spread: 0.8, tax_rate: 0.25, year: 12, jitter: 3, group: equity, probability: 0.03, confidence: low}

# Non-financial scores for the Decide tab (see sources and assumptions).
quality: {autonomy: 82, satisfaction: 0.7, burnout: 0.85}
