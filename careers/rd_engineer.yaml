name: R&D engineer
description: >
  Industry R&D in medical devices after the Ph.D. (e.g. back to J&J or a large
  OEM). Enters at senior/principal level given the Ph.D. plus 4 years of J&J
  experience. Steady pay, modest bonus swing, some layoff risk.

sources:
  - "Hours: Consulting-Specifying Engineer 2024 survey: engineers average 43 hrs/week, 24% work 50+: https://www.csemag.com/how-mep-fp-engineers-are-living-a-dual-reality/"
  - "Hours: Engineering Management Institute Future of Work report: architecture and engineering professionals average 45 hrs/week"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout and satisfaction: Jellyfish 2024 State of Engineering Management (604 respondents): 65% burned out in the past year (85% on teams under 10), 46% of engineers say their team is burned out, 75% find their work rewarding: https://jellyfish.co/blog/2024-state-of-engineering-management-report/"
  - "BLS OOH, Bioengineers and biomedical engineers: median $106,950 (May 2024): https://www.bls.gov/OOH/architecture-and-engineering/biomedical-engineers.htm"
  - "O*NET national wages 17-2031 (10th $71,850 / 90th $168,180): https://www.onetonline.org/link/localwages/17-2031.00"
  - "Levels.fyi Medtronic: senior engineer ~$141k, principal ~$156-159k, senior principal up to ~$201k: https://www.levels.fyi/companies/medtronic/salaries/mechanical-engineer"

assumptions:
  - "Enters at $150k total pay (between Medtronic senior and principal; a Ph.D. plus prior J&J years usually places above the BLS 90th percentile of all biomedical engineers)."
  - "Real raises average 1%/yr (above inflation; late-career raises flatten); promotion to senior principal or manager around age 35 (±2 yrs) at $195k."
  - "3% yearly chance of a layoff gap costing 40% of that year's pay."
  - "Employer 401(k) match about 6% of pay."
  - "Hours: 44/week, between the 43 (CSE 2024) and 45 (EMI) engineering survey averages. No biomedical-specific survey was found."
  - "Autonomy 75 (Bioengineers and Biomedical Engineers). Burnout 46% and satisfaction 75% from engineers in the Jellyfish survey (software-heavy sample, CHECK)."

income:
  - name: Career pay
    amount: 150000
    start_year: 4
    growth: {mean: 0.01, stdev: 0.03}
    noise: 0.05                 # bonus swings
    loss_probability: 0.03
    loss_fraction: 0.4
    taxable: true
  - name: Employer 401(k) match
    spendable: false            # goes straight into savings
    amount: 9000
    start_year: 4
    end_year: 43
    growth: {mean: 0.02, stdev: 0.0}

time:
  - {name: Work hours, amount: 44, start_year: 4}

events:
  - name: Promotion to senior principal
    confidence: medium
    type: set_amount
    target: Career pay
    amount: 195000
    year: 12
    jitter: 2

# Non-financial scores for the Decide tab (see sources and assumptions).
quality: {autonomy: 75, satisfaction: 0.75, burnout: 0.46}
