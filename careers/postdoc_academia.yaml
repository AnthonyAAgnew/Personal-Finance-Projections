name: Postdoc then academia
description: >
  NIH-scale postdoc after the Ph.D., then the academic job market: a
  tenure-track BME faculty job for a minority, industry for the rest.

sources:
  - "Hours: NSF (2003) postdocs average 50.3 hrs/week; Nature postdoc survey: over half work 50+, a quarter 60+: https://blogs.nature.com/naturejobs/2011/04/01/are-long-working-hours-inevitable-for-postdocs/"
  - "Hours: Iowa Board of Regents faculty activity report: faculty average 53.4 hrs/week, tenure-track 4-6 hours more than non-tenure-track: https://iowaregents.edu/news/newsletter/board-of-regents-news/november-2021-meeting-preview/faculty-activities-at-iowas-public-universities"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout: 2024 faculty surveys: 64% feel burned out to some degree (HMS), 41% report burnout (WGU Labs): https://www.ecampusnews.com/campus-leadership/2024/02/27/faculty-burnout-is-at-an-all-time-high/"
  - "Satisfaction: Nature 2023 postdoc survey: career dissatisfaction 24% on a first postdoc, 34% by the third or fourth: https://www.nature.com/naturecareers/article/nature-2023-postdoc-survey"
  - "NIH NRSA FY2025 postdoctoral stipends: $62,232 (year 0) to $75,564 (7+): https://www.niaid.nih.gov/grants-contracts/salary-cap-stipends"

assumptions:
  - "3-5 year postdoc starting at $62,232, rising ~2%/yr with NRSA steps."
  - "25% land a tenure-track job around age 30 (CHECK: commonly cited rates are 10-25%); the rest move to industry R&D at ~$140k, a little behind having gone straight to industry."
  - "Assistant professor ~$125k including summer salary (CHECK: no source found for BME assistant professor pay); 80% earn tenure 6 years later (~$150k), then 60% reach full professor (~$190k)."
  - "Denied tenure (20%): move to industry at ~$150k."
  - "Hours: postdoc 51 (NSF 50.3), assistant professor 58 (tenure-track runs 4-6 above the 53.4 faculty average), tenured 54, full professor 52, industry 44."
  - "Autonomy 95 (Biological Science Teachers, Postsecondary: 99; postdocs have less). Burnout 52% (midpoint of 2024 faculty surveys, 41-64%). Satisfaction 68% (Nature 2023 postdocs: 24-34% dissatisfied)."

