name: Data scientist / analytics
description: >
  Switch from BME to data-focused industry work (data science, analytics,
  biostatistics-adjacent roles). The M.S. in Statistics is the main asset.

sources:
  - "BLS OEWS May 2024 national tables (data scientists, SOC 15-2051): https://www.bls.gov/oes/2024/may/featured_data.htm"

assumptions:
  - "Senior data scientist at ~$150k (CHECK: the BLS median for data scientists was not returned by search; a Ph.D. plus an M.S. in Statistics usually starts above the median)."
  - "Staff level around age 38 (~$185k); 30% reach principal or manager (~$230k) around age 42. CHECK"
  - "4% yearly layoff risk; ~45 hours a week."

income:
  - {name: Career pay, amount: 150000, start_year: 2, growth: {mean: 0.01, stdev: 0.03}, noise: 0.06, loss_probability: 0.04, loss_fraction: 0.4, taxable: true}
  - {name: Employer 401(k) match, amount: 8000, start_year: 2, end_year: 36, spendable: false}

time:
  - {name: Work hours, amount: 45, start_year: 2, growth: {mean: -0.003, stdev: 0.01}}

events:
  - {name: Staff data scientist, type: set_amount, target: Career pay, amount: 185000, year: 7, jitter: 1}
  - {name: Principal or manager, type: set_amount, target: Career pay, amount: 230000, year: 11, jitter: 2, probability: 0.3}
