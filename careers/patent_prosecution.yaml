name: Patent attorney (prosecution, IP firm)
description: >
  JD after the Ph.D., then patent prosecution (drafting and arguing patent
  applications) at an IP firm. A technical Ph.D. is a big advantage here.
  Steady, billable-hour work; partnership is possible but not certain.

sources:
  - "Hours: Wells Fargo Legal Specialty Group via Bloomberg Law: top-100 firm lawyers billed ~1,551 hours in 2023; firm targets are 1,900-2,200 billable (Harvest): https://news.bloomberglaw.com/us-law-week/less-work-more-money-big-law-associates-never-had-it-better"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout: Bloomberg Law 2024 Attorney Workload survey: attorneys burned out 42% of the time on average, mid/senior associates 51%: https://pro.bloomberglaw.com/insights/company-news/bloomberg-law-releases-attorney-workload-survey-insights-and-webinar-on-work-life-balance-solutions/"
  - "ABA Young Lawyers Division 2024 survey: median law school debt $112,500 (via Bankrate): https://bankrate.com/loans/student-loans/average-law-school-debt"
  - "Private law school tuition averages about $49k-$53k/yr in 2025-26 (aggregators citing ABA data): https://www.bestcolleges.com/research/law-school-cost/"
  - "LeanLaw citing AIPLA 2023 Economic Survey: median full-time IP attorney in private practice $270k; equity partners $420k: https://www.leanlaw.co/blog/compensation-models-for-intellectual-property-law-firms-why-your-pay-structure-might-be-your-biggest-competitive-liability/"

assumptions:
  - "Full-time JD in years 4-6 (ages 26-28) at ~$50k/yr tuition, all borrowed at ~8% (federal grad rates are near 8%; 2026 federal caps may push part of it private). Living costs stay at your Ph.D.-level budget. Repaid over 10 years from graduation."
  - "A 2L summer associate job pays ~$40k (CHECK)."
  - "First-year prosecution associate at ~$200k (below the $225k BigLaw scale; IP boutiques often pay less). CHECK"
  - "Senior associate / counsel around age 33 at ~$270k (AIPLA private-practice median)."
  - "25% chance of equity partner around age 37 at ~$420k (AIPLA equity-partner median)."
  - "Hours: 50 in law school (CHECK) and as a prosecution associate: ~1,800 billable hours plus non-billable time over 48 weeks."
  - "Autonomy 92 (Lawyers). Burnout 42% (Bloomberg Law 2024 average). Satisfaction 62% (CHECK: Law360 2024 says most lawyers are satisfied but gives no share)."

