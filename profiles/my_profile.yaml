# Who you are today. Career files in careers/ are layered on top of this.
# Year 0 = now. Up to four more Ph.D. years (years 0-3, the worst case), so every
# career starts in year 4 (age 26).
# All money is in today's dollars: inflation is already taken out.
#
# Lines marked CHECK are guesses: replace them with your real numbers.

name: My profile
description: >
  2nd-year Ph.D. student at UC Irvine. 4 years at J&J before the Ph.D.
  B.S. Mechanical Engineering, M.S. BME, M.S. Statistics. Likely heading to
  med device engineering in industry.
start_age: 22
horizon_years: 73          # plan to age 95
paths: 10000
seed: 42
failure_floor: 0
borrowing_rate: 0.06       # real rate on any unplanned debt (credit, etc.)

include: ../data/taxes_ca_single.yaml

sources:
  - "IRS: 2025 limits: 401(k) employee deferral $23,500 (+$7,500 catch-up at 50+), IRA $7,000, HSA self-only $4,300: https://www.irs.gov/newsroom/401k-limit-increases-to-23500-for-2025-ira-limit-remains-7000"
  - "Damodaran, Historical Returns on Stocks, Bonds and Bills (1928-2024): S&P 500 ~9.9%, 10-year T-bonds ~4.5%, 3-month T-bills ~3.3% nominal averages: https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/histretSP.html"
  - "Hours: HEPI analysis of the Nature 2019 PhD survey: PhD students average 47 hrs/week: https://www.hepi.ac.uk/2020/06/25/new-report-shows-phd-students-work-50-more-than-undergraduates/"
  - "Hours: BLS 2024: 11.1% of workers 25-54, 14.2% of 55-64 and 38.3% of 65+ work part time: https://www.bls.gov/opub/ted/2025/38-3-percent-of-employed-older-americans-worked-part-time-in-2024.htm"

# $60k today: $20k cash reserve + $40k invested. CHECK: replace with your real split.
portfolio:
  starting_balance: 40000  # invested
  cash:
    balance: 20000         # emergency fund / checking
    reserve_months: 6      # savings refill the reserve to 6 months of spending first
    mean: 0.03             # nominal cash yield (T-bills averaged ~3.3% since 1928)
    stdev: 0.01
  returns:                 # stocks (nominal); deliberately below the ~10% US history
    model: normal
    mean: 0.07
    stdev: 0.15
  bonds:                   # nominal; 10-year Treasuries averaged ~4.5% since 1928
    mean: 0.045
    stdev: 0.07
    correlation: 0.1
  # Glide path: stock share by year (90% until 45, 60% at 65, 50% at 75). CHECK
  allocation: [[0, 0.9], [23, 0.9], [43, 0.6], [53, 0.5]]
  inflation:
    mean: 0.025
    stdev: 0.012

# Tax-advantaged accounts. Contribution limits are the IRS 2025 figures, held
# flat in today's dollars (limits are indexed to inflation). The $40k invested
# is assumed to be all taxable brokerage. CHECK: move any 401(k) or Roth money
# you already have into traditional / roth below.
accounts:
  k401: 23500              # employee 401(k) deferral while employed (2025 limit)
  roth_401k_share: 0.0     # share of the deferral made as Roth 401(k)
  ira: 7000                # Roth IRA (backdoor once income is too high)
  hsa: 4300                # self-only HSA limit; needs a high-deductible plan. CHECK
  traditional: 0
  roth: 0
  gains_rate: 0.24         # ~15% federal + ~9% California on long-term gains
  early_penalty: 0.10      # 401(k) withdrawals before ~59.5
  access_age: 60
  retirement_tax_rate: 0.15  # after-tax view only. CHECK

income:
  - name: Ph.D. stipend
    amount: 40000          # take-home (already after tax)
    end_year: 4            # worst case: 4 more years
  - name: Career pay       # every career file overrides this
    amount: 0
    start_year: 4
    taxable: true
  - name: Social Security
    amount: 36000          # CHECK: estimate at ssa.gov/myaccount; ~$36k is a high earner at 67
    start_year: 45         # age 67

# Budget categories, in today's dollars per month. These are your Ph.D.-era
# amounts; the lifestyle tiers below raise them as your income grows.
expenses:
  - {name: Housing, monthly: 1650, growth: {mean: 0.005, stdev: 0.01}}   # rent, utilities included
  - {name: Food, monthly: 600}
  - {name: Transport, monthly: 250}
  - {name: Health & insurance, monthly: 100}
  - {name: Utilities & phone, monthly: 60}    # phone only while rent includes utilities. CHECK
  - {name: Fun & dining, monthly: 200}
  - {name: Travel, monthly: 100}
  - {name: Shopping & other, monthly: 150}
  - {name: Giving, monthly: 0}
  - name: Healthcare in retirement
    amount: 8000
    start_year: 43         # age 65
    growth: {mean: 0.02, stdev: 0.02}

# Quality-of-life tiers. Each year your "affordable income" is your average
# take-home over the last 3 years plus a perpetual draw on your portfolio
# (withdrawal_rate x portfolio). Reaching a tier's take_home switches the
# listed categories to that tier's monthly budget. Between tiers you also
# spend `creep` of every extra dollar (lifestyle creep).
lifestyle:
  creep: 0.30              # CHECK: share of each extra dollar you spend
  withdrawal_rate: 0.035   # perpetual draw counted as affordable income
  smoothing_years: 3
  tiers:
    - name: Early career
      take_home: 90000
      monthly: {Housing: 2500, Food: 900, Transport: 600, Health & insurance: 300,
                Utilities & phone: 200, Fun & dining: 500, Travel: 400,
                Shopping & other: 400, Giving: 200}
    - name: $200k take-home
      take_home: 200000
      monthly: {Housing: 4500, Food: 1400, Transport: 900, Health & insurance: 400,
                Utilities & phone: 300, Fun & dining: 1000, Travel: 1200,
                Shopping & other: 800, Giving: 600}
    - name: $250k take-home
      take_home: 250000
      monthly: {Housing: 5500, Food: 1600, Transport: 1000, Health & insurance: 450,
                Utilities & phone: 350, Fun & dining: 1300, Travel: 1600,
                Shopping & other: 1000, Giving: 900}
    - name: $300k take-home
      take_home: 300000
      monthly: {Housing: 6500, Food: 1800, Transport: 1200, Health & insurance: 500,
                Utilities & phone: 400, Fun & dining: 1600, Travel: 2000,
                Shopping & other: 1200, Giving: 1200}

# Work hours per week. Careers set "Work hours" for each phase (school,
# residency, associate, founder...) from survey data listed in each career
# file; strategies (FIRE) change it like any other stream. Every career gets
# the same age taper below and a 5% year-to-year swing.
time:
  - name: Ph.D. hours
    amount: 47             # Nature 2019 PhD survey (HEPI analysis): 47/week average
    end_year: 4
  - name: Work hours
    amount: 0
    start_year: 4
    noise: 0.05

events:
  # Age taper: hours ease about 5% at 50 and another 5% at 58. BLS: part-time
  # work rises from 11% of workers at 25-54 to 14% at 55-64 and 38% at 65+;
  # CPS: physicians 36 and older work 50.7 hrs/week vs 54.1 under 36. CHECK
  - {name: Hours ease at 50, type: scale, target: Work hours, factor: 0.95, year: 28}
  - {name: Hours ease at 58, type: scale, target: Work hours, factor: 0.95, year: 36}
  - name: Retire
    type: set_amount
    target: [Career pay, Work hours]
    amount: 0
    year: 43               # age 65
