name: Quantitative finance (quant researcher)
description: >
  Quant researcher at a hedge fund or trading firm (New York). Ph.D. +
  statistics is the standard entry ticket. Very high, bonus-driven pay;
  performance-based job risk; higher cost of living.

sources:
  - "Hours: eFinancialCareers 2025 salary and bonus report: quant finance staff average 47 hrs/week, hedge funds 51: https://www.efinancialcareers.com/news/hedge-fund-working-hours"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout: Medius 2024 Financial Census (1,533 finance professionals): 55% report burnout: https://prnewswire.com/news-releases/overburdened-and-burnt-out-finance-teams-call-out-for-automation-to-address-lack-of-resources-driven-by-economic-uncertainty-medius-302206852.html"
  - "Jane Street new-grad quant researcher base $300k; Citadel Securities PhD graduate $235k-$300k + bonus (TraderMath / job postings): https://www.tradermath.org/salaries/quant-researcher"
  - "First-year total comp estimates ~$300k-$450k at top firms: https://www.tradermath.org/salaries/quant-compensation"

assumptions:
  - "Hiring odds (CHECK, low confidence): a 30% chance of an offer from a top trading firm (Jane Street, Citadel, Two Sigma tier), which take a small share of even strong Ph.D. applicants. Otherwise a quant role at a bank or smaller fund in New York at ~$200k, rising to ~$300k about 5 years in."
  - "Assumes you land the offer (top firms are very selective)."
  - "First-year total ~$350k; senior quant researcher around age 32 (~$600k); 20% become a portfolio manager or top performer (~$1.5M median, very wide spread) around age 36. CHECK"
  - "Bonuses swing pay +-30% a year; 8% yearly chance of being cut (half a year's pay lost)."
  - "New York costs ~25% more than Irvine across the lifestyle budget, and rent ~60% more at the base budget. Taxes use the California table (NY state + NYC rates are similar at these incomes)."
  - "Hours: 47/week (eFinancialCareers 2025 quant average; hedge funds 51)."
  - "Autonomy 71 (Financial Quantitative Analysts). Burnout 55% (Medius 2024 finance professionals). Satisfaction 65% (CHECK)."

income:
  - {name: Career pay, amount: 350000, start_year: 4, growth: {mean: 0.01, stdev: 0.05}, noise: 0.30, loss_probability: 0.08, loss_fraction: 0.5, taxable: true, confidence: medium}
  - {name: Employer 401(k) match, amount: 12000, start_year: 4, end_year: 43, spendable: false}

time:
