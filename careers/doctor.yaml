  - {name: Med school hours, type: set_amount, target: Work hours, amount: 55, same_time_as: Admitted to med school}
  - {name: Residency hours, type: set_amount, target: Work hours, amount: 67, same_time_as: Admitted to med school, offset: 4}
  - {name: Attending hours (primary care), type: set_amount, target: Work hours, amount: 50, same_time_as: Attending (primary care)}
