  - {name: Senior / staff scientist, type: set_amount, target: Career pay, amount: 320000, same_time_as: Big-tech or AI offer, offset: 4, jitter: 1, confidence: medium}
  - {name: Principal / director, type: set_amount, target: Career pay, amount: 450000, same_time_as: Big-tech or AI offer, offset: 9, jitter: 2, probability: 0.25, confidence: low}
