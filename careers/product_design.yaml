name: Product design engineer
description: >
  Switch from BME research to product-design-focused engineering (consumer
  or medical hardware): mechanical design, prototyping, DFM. Your M.E.
  background plus the Ph.D. places you at a senior level.

sources:
  - "Hours: Consulting-Specifying Engineer 2024 survey: engineers average 43 hrs/week, 24% work 50+: https://www.csemag.com/how-mep-fp-engineers-are-living-a-dual-reality/"
  - "Hours: Engineering Management Institute Future of Work report: architecture and engineering professionals average 45 hrs/week"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout and satisfaction: Jellyfish 2024 State of Engineering Management (604 respondents): 65% burned out in the past year (85% on teams under 10), 46% of engineers say their team is burned out, 75% find their work rewarding: https://jellyfish.co/blog/2024-state-of-engineering-management-report/"
  - "BLS OOH, mechanical engineers: median $102,320 (May 2024): https://www.bls.gov/OOH/architecture-and-engineering/mechanical-engineers.htm"

assumptions:
  - "Senior product design engineer at ~$135k (above the BLS median given the Ph.D. and J&J years). CHECK"
  - "Staff level around age 33 (~$170k); 25% reach principal at a top consumer-hardware company (~$230k) around age 37. CHECK"
  - "3% yearly layoff risk."
  - "Hours: 44/week, the same engineering survey data as R&D."
  - "Autonomy 81 (Mechanical Engineers). Burnout and satisfaction as for engineers (CHECK)."

income:
