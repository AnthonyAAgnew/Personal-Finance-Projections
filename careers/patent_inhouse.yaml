name: Patent counsel (in-house, med device / pharma)
description: >
  JD after the Ph.D., three years of prosecution at a firm, then in-house
  patent counsel at a large medical device or pharma company. Lower pay than
  BigLaw, much better hours, corporate bonus and stock.

sources:
  - "ABA Young Lawyers Division 2024 survey: median law school debt $112,500 (via Bankrate): https://bankrate.com/loans/student-loans/average-law-school-debt"
  - "Private law school tuition averages about $49k-$53k/yr in 2025-26 (aggregators citing ABA data): https://www.bestcolleges.com/research/law-school-cost/"
  - "LeanLaw citing AIPLA 2023 Economic Survey (private-practice medians, for comparison): https://www.leanlaw.co/blog/compensation-models-for-intellectual-property-law-firms-why-your-pay-structure-might-be-your-biggest-competitive-liability/"

assumptions:
  - "Full-time JD in years 2-4 (ages 31-33) at ~$50k/yr tuition, all borrowed at ~8% (federal grad rates are near 8%; 2026 federal caps may push part of it private). Living costs stay at your Ph.D.-level budget. Repaid over 10 years from graduation."
  - "A 2L summer associate job pays ~$40k (CHECK)."
  - "Three years at an IP firm at ~$200k, then in-house around age 37 at ~$250k total (base + bonus + stock). CHECK: AIPLA's corporate figures are members-only."
  - "35% chance of head of IP / chief IP counsel around age 45 at ~$420k. CHECK"
  - "~52 hours a week at the firm, ~45 in-house."

