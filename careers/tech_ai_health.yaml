name: Tech / AI health company
description: >
  BME + statistics skills at a big-tech health team or an AI-driven medtech
  company (ML scientist, applied scientist). Large stock-heavy pay, more
  layoff risk.

sources:
  - "Hours: Engineering Management Institute Future of Work report: architecture and engineering professionals average 45 hrs/week"
  - "Autonomy: O*NET work context 'Freedom to Make Decisions' (0-100; 75 = some freedom, 100 = a lot): https://www.onetonline.org/find/descriptor/result/4.C.3.a.4"
  - "Burnout and satisfaction: Jellyfish 2024 State of Engineering Management (604 respondents): 65% burned out in the past year (85% on teams under 10), 46% of engineers say their team is burned out, 75% find their work rewarding: https://jellyfish.co/blog/2024-state-of-engineering-management-report/"

assumptions:
  - "Hiring odds (CHECK): a 50% chance of a big-tech or AI health offer at ~$230k. Otherwise a data science role in medtech at ~$150k, reaching staff (~$185k) about 5 years in, as in the data science path."
  - "Total comp ~$230k at entry (base + bonus + RSUs), rising to ~$320k at senior/staff around age 32; 25% reach principal/director (~$450k) around age 37. CHECK: typical big-tech levels, no source found in search."
  - "Stock makes pay swing +-15% a year; 6% yearly layoff risk."
  - "Hours: 45/week (EMI's 45-hour average; big-tech norms are similar, CHECK)."
  - "Autonomy 82 (Software Developers). Burnout 65% (Jellyfish, all software respondents); satisfaction 75%."

income:
