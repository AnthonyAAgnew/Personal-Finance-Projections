name: Tech / AI health company
description: >
  BME + statistics skills at a big-tech health team or an AI-driven medtech
  company (ML scientist, applied scientist). Large stock-heavy pay, more
  layoff risk.

assumptions:
  - "Total comp ~$230k at entry (base + bonus + RSUs), rising to ~$320k at senior/staff around age 37; 25% reach principal/director (~$450k) around age 42. CHECK: typical big-tech levels, no source found in search."
  - "Stock makes pay swing +-15% a year; 6% yearly layoff risk."
  - "~50 hours a week, easing slightly with seniority."

income:
  - {name: Career pay, amount: 230000, start_year: 2, growth: {mean: 0.01, stdev: 0.04}, noise: 0.15, loss_probability: 0.06, loss_fraction: 0.4, taxable: true}
  - {name: Employer 401(k) match, amount: 10000, start_year: 2, end_year: 36, spendable: false}

time:
  - {name: Work hours, amount: 50, start_year: 2, growth: {mean: -0.004, stdev: 0.01}}

events:
  - {name: Senior / staff scientist, type: set_amount, target: Career pay, amount: 320000, year: 6, jitter: 1}
  - {name: Principal / director, type: set_amount, target: Career pay, amount: 450000, year: 11, jitter: 2, probability: 0.25}
